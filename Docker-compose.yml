services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-8000}:${PORT:-8000}"
    env_file:
      - .env
    environment:
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:5173}
      - PORT=${PORT:-8000}
    volumes:
      - ./backend:/app
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port ${PORT:-8000} --reload"